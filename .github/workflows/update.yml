name: myTCAS ViewTracker Auto-Update

on:
  schedule:
    # 06:00 น. เวลาไทย (23:00 UTC ของวันก่อนหน้า)
    - cron: '0 23 * * *'
    # 18:00 น. เวลาไทย (11:00 UTC ของวันเดียวกัน)
    - cron: '0 11 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตัวเองผ่านหน้า GitHub Actions

permissions:
  contents: write

concurrency:
  group: mytcas-scraper-group
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install Python Dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 4. Run Nationwide myTCAS Scraper Pipeline
        env:
          TZ: Asia/Bangkok
        run: |
          python scraper.py

      - name: 5. Commit and Push Updated Data
        env:
          TZ: Asia/Bangkok
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data/
          if git diff --staged --quiet; then
            echo "ไม่มีการเปลี่ยนแปลงของข้อมูลในรอบนี้"
          else
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "📊 Auto-update myTCAS views (${TIMESTAMP} TH) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
